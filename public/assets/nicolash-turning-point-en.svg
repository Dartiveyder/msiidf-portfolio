  <rect x="68" y="70" width="120" height="34" rx="17" fill="#efe6d1" stroke="#30291f" stroke-width="2"/>
  <text x="128" y="93" text-anchor="middle" fill="#6f6650" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="17" font-weight="700">BEFORE</text>
  <text x="68" y="166" fill="#30291f" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="30" font-weight="700">Nicolash</text>
  <text x="68" y="196" fill="#6f6650" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="19">Services and prices</text>

  <g font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="19" fill="#30291f">
    <rect x="68" y="222" width="504" height="62" rx="10" fill="#efe6d1" stroke="#30291f" stroke-width="2"/>
    <text x="90" y="260">Egyptian Volume</text>
