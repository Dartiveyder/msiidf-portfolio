<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg2)"/>

  <!-- connecting line -->
  <line x1="150" y1="200" x2="1050" y2="200" stroke="#2a2a2a" stroke-width="2"/>

  <!-- 5 nodes -->
  <g font-family="Arial, sans-serif">
    <!-- 1 -->
    <g transform="translate(150,200)">
      <circle r="10" fill="#3ddc6a"/>
      <text y="-28" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Site institucional</text>
      <text y="-8" text-anchor="middle" fill="#777777" font-size="12">Design → Next.js → Vercel</text>
      <text y="36" text-anchor="middle" fill="#9a9a9a" font-size="12">Serviços, fotos, preços,</text>
      <text y="54" text-anchor="middle" fill="#9a9a9a" font-size="12">responsivo mobile</text>
    </g>

    <!-- 2 -->
    <g transform="translate(375,200)">
      <circle r="10" fill="#3ddc6a"/>
      <text y="-28" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Agendamento online</text>
      <text y="-8" text-anchor="middle" fill="#777777" font-size="12">Calendário + confirmação</text>
      <text y="36" text-anchor="middle" fill="#9a9a9a" font-size="12">Sem horários sobrepostos,</text>
      <text y="54" text-anchor="middle" fill="#9a9a9a" font-size="12">cancelamento via WhatsApp</text>
    </g>

    <!-- 3 -->
    <g transform="translate(600,200)">
      <!-- center -->
      <circle r="10" fill="#3ddc6a"/>
      <text y="-28" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Painel administrativo</text>
      <text y="-8" text-anchor="middle" fill="#777777" font-size="12">Mobile-first · /admin</text>
      <text y="36" text-anchor="middle" fill="#9a9a9a" font-size="12">Agenda, bloqueios,</text>
      <text y="54" text-anchor="middle" fill="#9a9a9a" font-size="12">status dos horários</text>
    </g>

    <!-- 4 -->
    <g transform="translate(825,200)">
      <circle r="10" fill="#3ddc6a"/>
      <text y="-28" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Segurança dos dados</text>
      <text y="-8" text-anchor="middle" fill="#777777" font-size="12">Criptografia + sessão</text>
      <text y="36" text-anchor="middle" fill="#9a9a9a" font-size="12">AES-256-GCM, cookies</text>
      <text y="54" text-anchor="middle" fill="#9a9a9a" font-size="12">assinados, senha com hash</text>
    </g>

    <!-- 5 -->
    <g transform="translate(1050,200)">
      <circle r="12" fill="#3ddc6a"/>
      <text y="-28" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Migração de hospedagem</text>
      <text y="-8" text-anchor="middle" fill="#777777" font-size="12">Vercel → PHP/MySQL</text>
      <text y="36" text-anchor="middle" fill="#9a9a9a" font-size="12">cPanel + Git Version</text>
      <text y="54" text-anchor="middle" fill="#9a9a9a" font-size="12">Control, custo menor</text>
    </g>
  </g>

  <!-- bottom labels: cost trigger -->
  <g transform="translate(600,440)" font-family="Arial, sans-serif">
    <rect x="-280" y="-30" width="560" height="64" rx="16" fill="#151515" stroke="#2a2a2a"/>
    <text text-anchor="middle" y="-4" fill="#e5e5e5" font-size="13" font-weight="700">O gatilho da migração: custo</text>
    <text text-anchor="middle" y="18" fill="#9a9a9a" font-size="12">Hospedagem mensal na Vercel ficou alta para um negócio pequeno</text>
  </g>
</svg>
