    <rect x="40" y="60" width="440" height="300" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="260" cy="116" r="28" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="260" y="125" text-anchor="middle" fill="#2f7d46" font-size="24" font-weight="700">1</text>
    <text x="260" y="186" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Site institucional</text>
    <text x="260" y="214" text-anchor="middle" fill="#716b54" font-size="19">Design → Next.js → Vercel</text>
    <text x="260" y="266" text-anchor="middle" fill="#55503f" font-size="22">Serviços, fotos, preços,</text>
