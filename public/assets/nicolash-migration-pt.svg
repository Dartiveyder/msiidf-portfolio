      <text y="-16" text-anchor="middle" fill="#bcd4c2" font-size="17">no cPanel</text>
      <text y="48" text-anchor="middle" fill="#f4efe0" font-size="17">Clona o projeto,</text>
      <text y="72" text-anchor="middle" fill="#f4efe0" font-size="17">"pull" publica</text>
    </g>

    <g transform="translate(1390,198)">
      <circle r="17" fill="#6fcf8e" stroke="#f4efe0" stroke-width="2.5"/>
      <text y="-40" text-anchor="middle" fill="#f4efe0" font-size="24" font-weight="700">MySQL</text>
      <text y="-16" text-anchor="middle" fill="#bcd4c2" font-size="17">via phpMyAdmin</text>
      <text y="48" text-anchor="middle" fill="#f4efe0" font-size="17">Esquema + dados</text>
