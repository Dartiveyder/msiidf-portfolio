  </g>
  <g font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="18" fill="#30291f">
    <text x="754" y="292">3</text><text x="798" y="292">4</text><text x="842" y="292">5</text>
    <circle cx="896" cy="286" r="18" fill="#2f7d46"/>
