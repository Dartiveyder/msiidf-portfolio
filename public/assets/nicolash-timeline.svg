    <text x="1240" y="186" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Painel administrativo</text>
    <text x="1240" y="214" text-anchor="middle" fill="#716b54" font-size="19">Mobile-first · /admin</text>
    <text x="1240" y="266" text-anchor="middle" fill="#55503f" font-size="22">Agenda, bloqueios,</text>
