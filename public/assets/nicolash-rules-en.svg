<svg viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgRulesEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="320" fill="url(#bgRulesEn)"/>

  <g font-family="Arial, sans-serif">
    <!-- card 1 -->
    <rect x="20" y="30" width="250" height="260" rx="16" fill="#151515" stroke="#2a2a2a"/>
    <circle cx="145" cy="86" r="26" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="145" y="94" text-anchor="middle" fill="#3ddc6a" font-size="20" font-weight="700">1</text>
    <text x="145" y="150" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Instant</text>
    <text x="145" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">confirmation</text>
    <text x="145" y="202" text-anchor="middle" fill="#cfcfcf" font-size="13">No manual approval, the</text>
    <text x="145" y="224" text-anchor="middle" fill="#cfcfcf" font-size="13">booking confirms right away.</text>

    <!-- card 2 -->
    <rect x="297" y="30" width="250" height="260" rx="16" fill="#151515" stroke="#2a2a2a"/>
    <circle cx="422" cy="86" r="26" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="422" y="94" text-anchor="middle" fill="#3ddc6a" font-size="20" font-weight="700">2</text>
    <text x="422" y="161" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">No buffer time</text>
    <text x="422" y="198" text-anchor="middle" fill="#cfcfcf" font-size="13">Back-to-back schedule,</text>
    <text x="422" y="220" text-anchor="middle" fill="#cfcfcf" font-size="13">no gap between appointments.</text>

    <!-- card 3 -->
    <rect x="575" y="30" width="250" height="260" rx="16" fill="#151515" stroke="#2a2a2a"/>
    <circle cx="700" cy="86" r="26" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="700" y="94" text-anchor="middle" fill="#3ddc6a" font-size="20" font-weight="700">3</text>
    <text x="700" y="150" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Cancel via</text>
    <text x="700" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">WhatsApp</text>
    <text x="700" y="202" text-anchor="middle" fill="#cfcfcf" font-size="13">Never through the site,</text>
    <text x="700" y="224" text-anchor="middle" fill="#cfcfcf" font-size="13">always with the pro directly.</text>

    <!-- card 4 -->
    <rect x="852" y="30" width="250" height="260" rx="16" fill="#151515" stroke="#2a2a2a"/>
    <circle cx="977" cy="86" r="26" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="977" y="94" text-anchor="middle" fill="#3ddc6a" font-size="20" font-weight="700">4</text>
    <text x="977" y="150" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">No limit</text>
    <text x="977" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">per client</text>
    <text x="977" y="202" text-anchor="middle" fill="#cfcfcf" font-size="13">Anyone can book as many</text>
    <text x="977" y="224" text-anchor="middle" fill="#cfcfcf" font-size="13">time slots as they want.</text>

    <!-- card 5 -->
    <rect x="1130" y="30" width="250" height="260" rx="16" fill="#151515" stroke="#e5a24b" stroke-opacity="0.5"/>
    <circle cx="1255" cy="86" r="26" fill="#1a1a1a" stroke="#e5a24b" stroke-width="2"/>
    <text x="1255" y="94" text-anchor="middle" fill="#e5a24b" font-size="20" font-weight="700">5</text>
    <text x="1255" y="150" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">30% cancellation</text>
    <text x="1255" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">fee</text>
    <text x="1255" y="202" text-anchor="middle" fill="#cfcfcf" font-size="13">For cancellations with</text>
    <text x="1255" y="224" text-anchor="middle" fill="#cfcfcf" font-size="13">less than 24 hours' notice.</text>
  </g>
</svg>
