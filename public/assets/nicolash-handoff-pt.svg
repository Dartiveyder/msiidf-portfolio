  </defs>
  <rect width="1400" height="360" fill="url(#bgHandoffPt)"/>

  <line x1="213" y1="180" x2="684" y2="180" stroke="#4a4a4a" stroke-width="2.5" marker-end="url(#arrowPt)"/>
  <line x1="713" y1="180" x2="1184" y2="180" stroke="#4a4a4a" stroke-width="2.5" marker-end="url(#arrowPt)"/>

  <g font-family="Arial, sans-serif">
