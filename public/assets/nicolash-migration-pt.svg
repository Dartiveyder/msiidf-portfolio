    <path d="M554,198 L535,187" stroke="#e8e3d0" stroke-width="3" stroke-linecap="round"/>
    <path d="M554,198 L538,210" stroke="#e8e3d0" stroke-width="3" stroke-linecap="round"/>

    <path d="M586,198 Q770,174 954,198" stroke="#e8e3d0" stroke-width="3" stroke-linecap="round"/>
