  <text x="600" y="594" text-anchor="middle" fill="#e5e5e5" font-family="Arial, sans-serif" font-size="16" font-weight="700">O pedido que mudou o escopo</text>
  <text x="600" y="618" text-anchor="middle" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="14">Clientes passam a agendar sozinhas, sem depender de mensagem</text>
