  <g font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="17">
    <rect x="754" y="320" width="92" height="40" rx="9" fill="#f7f1e1" stroke="#30291f" stroke-width="1.5"/>
