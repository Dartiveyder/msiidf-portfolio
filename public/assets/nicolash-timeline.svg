    <path d="M514,198 L530,210 L514,222"/>
    <path d="M970,210 L1018,210"/>
    <path d="M1004,198 L1020,210 L1004,222"/>
    <path d="M1240,362 L1240,400 L505,400 L505,438"/>
    <path d="M493,424 L507,440 L521,424"/>
    <path d="M725,590 L773,590"/>
    <path d="M759,578 L775,590 L759,602"/>
