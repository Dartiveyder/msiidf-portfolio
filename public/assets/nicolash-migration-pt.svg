<svg viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="420" fill="#ffffff"/>

  <g stroke="#9a937a" stroke-width="2.5" fill="none">
    <path d="M340,210 L380,210"/>
    <path d="M366,198 L382,210 L366,222"/>
    <path d="M680,210 L720,210"/>
    <path d="M706,198 L722,210 L706,222"/>
    <path d="M1020,210 L1060,210"/>
    <path d="M1006,198 L1022,210 L1006,222"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="60" width="300" height="300" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="190" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="190" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">1</text>
    <text x="190" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">GitHub</text>
    <text x="190" y="240" text-anchor="middle" fill="#716b54" font-size="20">Repositório privado</text>
    <text x="190" y="282" text-anchor="middle" fill="#55503f" font-size="22">Só o que vai</text>
    <text x="190" y="308" text-anchor="middle" fill="#55503f" font-size="22">para produção</text>

    <!-- card 2 -->
    <rect x="380" y="60" width="300" height="300" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="530" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="530" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">2</text>
    <text x="530" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Chave SSH</text>
    <text x="530" y="240" text-anchor="middle" fill="#716b54" font-size="20">Somente leitura</text>
    <text x="530" y="282" text-anchor="middle" fill="#55503f" font-size="22">Sem usar a senha</text>
    <text x="530" y="308" text-anchor="middle" fill="#55503f" font-size="22">pessoal da conta</text>

    <!-- card 3 -->
    <rect x="720" y="60" width="300" height="300" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="870" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="870" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">3</text>
    <text x="870" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">cPanel</text>
    <text x="870" y="240" text-anchor="middle" fill="#716b54" font-size="20">Git Version Control</text>
    <text x="870" y="282" text-anchor="middle" fill="#55503f" font-size="22">Clona o projeto,</text>
    <text x="870" y="308" text-anchor="middle" fill="#55503f" font-size="22">"pull" publica</text>

    <!-- card 4 -->
    <rect x="1060" y="60" width="300" height="300" rx="16" fill="#faf6ea" stroke="#2f7d46" stroke-width="2.5"/>
    <circle cx="1210" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="1210" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">4</text>
    <text x="1210" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">MySQL</text>
    <text x="1210" y="240" text-anchor="middle" fill="#716b54" font-size="20">via phpMyAdmin</text>
    <text x="1210" y="282" text-anchor="middle" fill="#55503f" font-size="22">Esquema e dados</text>
    <text x="1210" y="308" text-anchor="middle" fill="#55503f" font-size="22">migrados do Postgres</text>
  </g>
</svg>
