  <rect width="1200" height="320" fill="url(#bgHandoffPt)"/>

  <line x1="80" y1="160" x2="372" y2="160" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrowPt)"/>
  <line x1="480" y1="160" x2="772" y2="160" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrowPt)"/>
  <line x1="880" y1="160" x2="1120" y2="160" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrowPt)"/>

  <g font-family="Arial, sans-serif">
