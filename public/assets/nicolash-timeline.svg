    <text x="505" y="566" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Segurança dos dados</text>
    <text x="505" y="594" text-anchor="middle" fill="#716b54" font-size="19">Criptografia + conformidade</text>
    <text x="505" y="646" text-anchor="middle" fill="#55503f" font-size="22">LGPD, sessão segura,</text>
