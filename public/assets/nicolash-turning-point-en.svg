  <text x="754" y="402" fill="#6f6650" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="16">Name and phone filled in by the client</text>

  <rect x="728" y="452" width="504" height="56" rx="28" fill="#2f7d46"/>
  <text x="980" y="487" text-anchor="middle" fill="#f7f1e1" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="19" font-weight="700">Confirm booking</text>
  <text x="728" y="542" fill="#2f7d46" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="16">Instant confirmation, no message needed</text>

  <!-- arrow between panels -->
  <path d="M608,300 Q650,292 690,300" stroke="#e8e3d0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M690,300 L672,290" stroke="#e8e3d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M690,300 L674,312" stroke="#e8e3d0" stroke-width="3" stroke-linecap="round"/>

  <!-- bottom banner -->
  <rect x="200" y="620" width="900" height="100" rx="18" fill="#f7f1e1" stroke="#30291f" stroke-width="2.5"/>
  <text x="650" y="662" text-anchor="middle" fill="#30291f" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="22" font-weight="700">The request that changed the scope</text>
  <text x="650" y="692" text-anchor="middle" fill="#6f6650" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="18">Clients start booking for themselves, with no message needed</text>
</svg>
