<svg viewBox="0 0 1400 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="460" fill="#ffffff"/>

  <g stroke="#9a937a" stroke-width="2.5" fill="none">
    <path d="M340,230 L380,230"/>
    <path d="M366,218 L382,230 L366,242"/>
    <path d="M680,230 L720,230"/>
    <path d="M706,218 L722,230 L706,242"/>
    <path d="M1020,230 L1060,230"/>
    <path d="M1006,218 L1022,230 L1006,242"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- card 1: Cliente -->
    <rect x="40" y="60" width="300" height="340" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="190" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="190" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">1</text>
    <text x="190" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Cliente</text>
    <text x="190" y="240" text-anchor="middle" fill="#716b54" font-size="20">Briefing inicial</text>
    <text x="190" y="282" text-anchor="middle" fill="#55503f" font-size="22">Fotos, preços,</text>
    <text x="190" y="308" text-anchor="middle" fill="#55503f" font-size="22">manutenção e</text>
    <text x="190" y="334" text-anchor="middle" fill="#55503f" font-size="22">cancelamento</text>

    <!-- card 2: Figma -->
    <rect x="380" y="60" width="300" height="340" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="530" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="530" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">2</text>
    <text x="530" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Figma</text>
    <text x="530" y="240" text-anchor="middle" fill="#716b54" font-size="20">Design original</text>
    <text x="530" y="282" text-anchor="middle" fill="#55503f" font-size="22">Referências de estilo,</text>
    <text x="530" y="308" text-anchor="middle" fill="#55503f" font-size="22">estrutura e identidade</text>

    <!-- card 3: Claude Design -->
    <rect x="720" y="60" width="300" height="340" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="870" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="870" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">3</text>
    <text x="870" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Claude Design</text>
    <text x="870" y="240" text-anchor="middle" fill="#716b54" font-size="20">Refino de interface</text>
    <text x="870" y="282" text-anchor="middle" fill="#55503f" font-size="22">Handoff preparado</text>
    <text x="870" y="308" text-anchor="middle" fill="#55503f" font-size="22">para implementação</text>

    <!-- card 4: Claude Code -->
    <rect x="1060" y="60" width="300" height="340" rx="16" fill="#faf6ea" stroke="#2f7d46" stroke-width="2.5"/>
    <circle cx="1210" cy="120" r="30" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="1210" y="130" text-anchor="middle" fill="#2f7d46" font-size="26" font-weight="700">4</text>
    <text x="1210" y="210" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Claude Code</text>
    <text x="1210" y="240" text-anchor="middle" fill="#716b54" font-size="20">Implementação</text>
    <text x="1210" y="282" text-anchor="middle" fill="#55503f" font-size="22">Projeto Next.js real,</text>
    <text x="1210" y="308" text-anchor="middle" fill="#55503f" font-size="22">pronto para produção</text>
  </g>
</svg>
