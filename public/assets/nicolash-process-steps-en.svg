<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgStepsEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bgStepsEn)"/>

  <g font-family="Arial, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="40" width="260" height="400" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="170" cy="104" r="30" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="170" y="115" text-anchor="middle" fill="#3ddc6a" font-size="27" font-weight="700">1</text>
    <text x="170" y="178" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">Rebuilding</text>
    <text x="170" y="200" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">the handoff</text>
    <text x="170" y="234" text-anchor="middle" fill="#cfcfcf" font-size="14">Handoff rebuilt as a</text>
    <text x="170" y="256" text-anchor="middle" fill="#cfcfcf" font-size="14">real Next.js project.</text>

    <!-- card 2 -->
    <rect x="327" y="40" width="260" height="400" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="457" cy="104" r="30" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="457" y="115" text-anchor="middle" fill="#3ddc6a" font-size="27" font-weight="700">2</text>
    <text x="457" y="178" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">Choosing</text>
    <text x="457" y="200" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">the stack</text>
    <text x="457" y="234" text-anchor="middle" fill="#cfcfcf" font-size="14">Best language and</text>
    <text x="457" y="256" text-anchor="middle" fill="#cfcfcf" font-size="14">framework, free: Next.js</text>
    <text x="457" y="278" text-anchor="middle" fill="#cfcfcf" font-size="14">on Vercel.</text>

    <!-- card 3 -->
    <rect x="614" y="40" width="260" height="400" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="744" cy="104" r="30" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="744" y="115" text-anchor="middle" fill="#3ddc6a" font-size="27" font-weight="700">3</text>
    <text x="744" y="178" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">Visual</text>
    <text x="744" y="200" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">iteration</text>
    <text x="744" y="234" text-anchor="middle" fill="#cfcfcf" font-size="14">Screenshots become</text>
    <text x="744" y="256" text-anchor="middle" fill="#cfcfcf" font-size="14">reusable component</text>
    <text x="744" y="278" text-anchor="middle" fill="#cfcfcf" font-size="14">patterns.</text>

    <!-- card 4 -->
    <rect x="900" y="40" width="260" height="400" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="1030" cy="104" r="30" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="1030" y="115" text-anchor="middle" fill="#3ddc6a" font-size="27" font-weight="700">4</text>
    <text x="1030" y="178" text-anchor="middle" fill="#f5f5f5" font-size="17" font-weight="700">Mobile-first</text>
    <text x="1030" y="234" text-anchor="middle" fill="#cfcfcf" font-size="14">Acceptance criterion</text>
    <text x="1030" y="256" text-anchor="middle" fill="#cfcfcf" font-size="14">from the first delivery,</text>
    <text x="1030" y="278" text-anchor="middle" fill="#cfcfcf" font-size="14">built for phones.</text>
  </g>
</svg>
