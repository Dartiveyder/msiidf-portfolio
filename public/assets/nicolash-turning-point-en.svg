  <text x="68" y="542" fill="#8a8169" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="16">No real schedule, no conflict control</text>

  <!-- Panel B: After -->
  <rect x="700" y="40" width="560" height="520" rx="20" fill="#f7f1e1" stroke="#2f7d46" stroke-width="3" transform="rotate(0.5 980 300)"/>
  <rect x="728" y="70" width="100" height="34" rx="17" fill="#efe6d1" stroke="#2f7d46" stroke-width="2.5"/>
  <text x="778" y="93" text-anchor="middle" fill="#2f7d46" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="17" font-weight="700">AFTER</text>
  <text x="728" y="166" fill="#30291f" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="30" font-weight="700">Nicolash</text>
  <text x="728" y="196" fill="#6f6650" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="19">Online booking</text>

  <rect x="728" y="222" width="504" height="200" rx="14" fill="#efe6d1" stroke="#30291f" stroke-width="2"/>
  <g font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="16" fill="#8a8169">
