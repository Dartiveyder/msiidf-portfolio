<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgTurnEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgTurnEn)"/>

  <!-- Panel A: Before -->
  <rect x="60" y="40" width="500" height="480" rx="20" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="90" y="68" width="106" height="28" rx="14" fill="#1a1a1a" stroke="#3a3a3a"/>
  <text x="143" y="87" text-anchor="middle" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="13" font-weight="700">BEFORE</text>
  <text x="90" y="142" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="22" font-weight="700">Nicolash</text>
  <text x="90" y="166" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="15">Services and prices</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#cfcfcf">
    <rect x="90" y="192" width="440" height="56" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="110" y="226">Egyptian Volume</text>
    <text x="490" y="226" text-anchor="end" fill="#9a9a9a">$40</text>
    <rect x="90" y="256" width="440" height="56" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="110" y="290">Classic Lash Extensions</text>
    <text x="490" y="290" text-anchor="end" fill="#9a9a9a">$30</text>
    <rect x="90" y="320" width="440" height="56" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="110" y="354">Eyebrow Design</text>
    <text x="490" y="354" text-anchor="end" fill="#9a9a9a">$12</text>
  </g>

  <rect x="90" y="402" width="440" height="50" rx="25" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <text x="310" y="432" text-anchor="middle" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="15">Book via WhatsApp</text>
  <text x="90" y="484" fill="#898989" font-family="Arial, sans-serif" font-size="13">No real schedule, no conflict control</text>

  <!-- Panel B: After -->
  <rect x="640" y="40" width="500" height="480" rx="20" fill="#151515" stroke="#3ddc6a" stroke-width="2"/>
  <rect x="670" y="68" width="90" height="28" rx="14" fill="#1a1a1a" stroke="#3ddc6a"/>
  <text x="715" y="87" text-anchor="middle" fill="#3ddc6a" font-family="Arial, sans-serif" font-size="13" font-weight="700">AFTER</text>
  <text x="670" y="142" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="22" font-weight="700">Nicolash</text>
  <text x="670" y="166" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="15">Online booking</text>

  <rect x="670" y="192" width="440" height="180" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#898989">
    <text x="692" y="220">S</text><text x="730" y="220">M</text><text x="768" y="220">T</text>
    <text x="806" y="220">W</text><text x="844" y="220">T</text><text x="882" y="220">F</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#cfcfcf">
    <text x="692" y="252">3</text><text x="730" y="252">4</text><text x="768" y="252">5</text>
    <circle cx="815" cy="247" r="16" fill="#3ddc6a"/>
    <text x="810" y="252" fill="#0d0d0d" font-weight="700">6</text>
    <text x="844" y="252">7</text><text x="882" y="252">8</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="692" y="278" width="78" height="34" rx="8" fill="#151515" stroke="#333333"/>
    <text x="704" y="300" fill="#cfcfcf">09:00</text>
    <rect x="782" y="278" width="78" height="34" rx="8" fill="#3ddc6a"/>
    <text x="794" y="300" fill="#0d0d0d" font-weight="700">11:00</text>
    <rect x="872" y="278" width="78" height="34" rx="8" fill="#151515" stroke="#333333"/>
    <text x="884" y="300" fill="#cfcfcf">14:30</text>
  </g>
  <text x="692" y="348" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="13">Name and phone filled in by the client</text>

  <rect x="670" y="402" width="440" height="50" rx="25" fill="#3ddc6a"/>
  <text x="890" y="432" text-anchor="middle" fill="#0d0d0d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Confirm booking</text>
  <text x="670" y="484" fill="#3ddc6a" font-family="Arial, sans-serif" font-size="13">Instant confirmation, no message needed</text>

  <!-- arrow between panels -->
  <path d="M568 280 L628 280" stroke="#4a4a4a" stroke-width="3" fill="none"/>
  <path d="M614 268 L630 280 L614 292" fill="none" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom banner -->
  <rect x="200" y="556" width="800" height="90" rx="16" fill="#101010" stroke="#2a2a2a" stroke-dasharray="4 4"/>
  <text x="600" y="594" text-anchor="middle" fill="#e5e5e5" font-family="Arial, sans-serif" font-size="16" font-weight="700">The request that changed the scope</text>
  <text x="600" y="618" text-anchor="middle" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="14">Clients start booking for themselves, with no message needed</text>
</svg>
