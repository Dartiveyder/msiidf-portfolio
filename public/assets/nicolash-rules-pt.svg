<svg viewBox="0 0 1300 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="1300" height="680" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="40" width="380" height="280" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="230" cy="96" r="26" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="230" y="104" text-anchor="middle" fill="#2f7d46" font-size="22" font-weight="700">1</text>
    <text x="230" y="150" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Confirmação</text>
    <text x="230" y="178" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">instantânea</text>
    <text x="230" y="220" text-anchor="middle" fill="#55503f" font-size="21">Sem aprovação manual, a</text>
    <text x="230" y="246" text-anchor="middle" fill="#55503f" font-size="21">reserva nasce confirmada.</text>

    <!-- card 2 -->
    <rect x="470" y="40" width="380" height="280" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="660" cy="96" r="26" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="660" y="104" text-anchor="middle" fill="#2f7d46" font-size="22" font-weight="700">2</text>
    <text x="660" y="164" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Sem intervalo</text>
    <text x="660" y="220" text-anchor="middle" fill="#55503f" font-size="21">Agenda corrida, atendimentos</text>
    <text x="660" y="246" text-anchor="middle" fill="#55503f" font-size="21">emendados um no outro.</text>

    <!-- card 3 -->
    <rect x="900" y="40" width="380" height="280" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="1090" cy="96" r="26" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="1090" y="104" text-anchor="middle" fill="#2f7d46" font-size="22" font-weight="700">3</text>
    <text x="1090" y="150" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Cancelamento</text>
    <text x="1090" y="178" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">por WhatsApp</text>
    <text x="1090" y="220" text-anchor="middle" fill="#55503f" font-size="21">Nunca pelo site, sempre</text>
    <text x="1090" y="246" text-anchor="middle" fill="#55503f" font-size="21">direto com a profissional.</text>

    <!-- card 4 -->
    <rect x="245" y="360" width="380" height="280" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="435" cy="416" r="26" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="435" y="424" text-anchor="middle" fill="#2f7d46" font-size="22" font-weight="700">4</text>
    <text x="435" y="470" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Sem limite</text>
    <text x="435" y="498" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">por cliente</text>
    <text x="435" y="540" text-anchor="middle" fill="#55503f" font-size="21">Qualquer pessoa marca</text>
    <text x="435" y="566" text-anchor="middle" fill="#55503f" font-size="21">quantos horários quiser.</text>

    <!-- card 5 -->
    <rect x="675" y="360" width="380" height="280" rx="16" fill="#faf6ea" stroke="#b1452f" stroke-width="2.5"/>
    <circle cx="865" cy="416" r="26" fill="#ffffff" stroke="#b1452f" stroke-width="2.5"/>
    <text x="865" y="424" text-anchor="middle" fill="#b1452f" font-size="22" font-weight="700">5</text>
    <text x="865" y="484" text-anchor="middle" fill="#201d16" font-size="26" font-weight="700">Multa de 30%</text>
    <text x="865" y="540" text-anchor="middle" fill="#55503f" font-size="21">Para cancelar com menos</text>
    <text x="865" y="566" text-anchor="middle" fill="#55503f" font-size="21">de 24h de antecedência.</text>
  </g>
</svg>
