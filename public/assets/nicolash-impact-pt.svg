<svg viewBox="0 0 1100 940" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="940" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Box 1: Problema -->
    <rect x="40" y="40" width="1020" height="220" rx="16" fill="#faf6ea" stroke="#b1452f" stroke-width="2"/>
    <text x="76" y="88" fill="#201d16" font-size="24" font-weight="700">Problema identificado</text>
    <g font-size="18" fill="#201d16">
      <circle cx="90" cy="126" r="6" fill="#b1452f"/>
      <text x="112" y="132">Agendamento só por WhatsApp, demora para confirmar</text>
      <circle cx="90" cy="164" r="6" fill="#b1452f"/>
      <text x="112" y="170">Risco de duas pessoas marcarem o mesmo horário</text>
      <circle cx="90" cy="202" r="6" fill="#b1452f"/>
      <text x="112" y="208">Custo de hospedagem alto para o tamanho do negócio</text>
    </g>

    <path d="M550,260 L550,312" stroke="#9a937a" stroke-width="2.5" fill="none"/>
    <path d="M536,296 L550,314 L564,296" fill="none" stroke="#9a937a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Box 2: Decisões -->
    <rect x="40" y="320" width="1020" height="220" rx="16" fill="#faf6ea" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="76" y="368" fill="#201d16" font-size="24" font-weight="700">Decisões tomadas com Claude Code</text>
    <g font-size="18" fill="#201d16">
      <circle cx="90" cy="406" r="6" fill="#2f7d46"/>
      <text x="112" y="412">Sistema de agendamento com trava de concorrência</text>
      <circle cx="90" cy="444" r="6" fill="#2f7d46"/>
      <text x="112" y="450">Criptografia de dados + conformidade com a LGPD</text>
      <circle cx="90" cy="482" r="6" fill="#2f7d46"/>
      <text x="112" y="488">Migração de Next.js/Vercel para PHP e MySQL</text>
    </g>

    <path d="M550,540 L550,592" stroke="#9a937a" stroke-width="2.5" fill="none"/>
    <path d="M536,576 L550,594 L564,576" fill="none" stroke="#9a937a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Box 3: Impacto -->
    <rect x="40" y="600" width="1020" height="300" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <text x="76" y="650" fill="#201d16" font-size="24" font-weight="700">Impacto</text>

    <g>
      <rect x="76" y="682" width="296" height="182" rx="14" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
      <text x="224" y="768" text-anchor="middle" fill="#2f7d46" font-size="52" font-weight="700">100%</text>
      <text x="224" y="802" text-anchor="middle" fill="#55503f" font-size="18">Paridade de funcionalidades</text>
      <text x="224" y="826" text-anchor="middle" fill="#55503f" font-size="18">na migração</text>

      <rect x="402" y="682" width="296" height="182" rx="14" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
      <text x="550" y="768" text-anchor="middle" fill="#2f7d46" font-size="52" font-weight="700">0</text>
      <text x="550" y="802" text-anchor="middle" fill="#55503f" font-size="18">Conflitos de</text>
      <text x="550" y="826" text-anchor="middle" fill="#55503f" font-size="18">horário</text>

      <rect x="728" y="682" width="296" height="182" rx="14" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
      <text x="876" y="768" text-anchor="middle" fill="#2f7d46" font-size="52" font-weight="700">2</text>
      <text x="876" y="802" text-anchor="middle" fill="#55503f" font-size="18">Arquiteturas</text>
      <text x="876" y="826" text-anchor="middle" fill="#55503f" font-size="18">completas</text>
    </g>
  </g>
</svg>
