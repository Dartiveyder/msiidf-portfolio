  <text x="670" y="478" fill="#3ddc6a" font-family="Arial, sans-serif" font-size="11">Confirmação instantânea, sem trocar mensagem</text>

  <!-- arrow between panels -->
  <path d="M568 280 L628 280" stroke="#3a3a3a" stroke-width="3" fill="none"/>
  <path d="M614 268 L630 280 L614 292" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom banner -->
  <rect x="220" y="548" width="760" height="80" rx="16" fill="#101010" stroke="#2a2a2a" stroke-dasharray="4 4"/>
  <text x="600" y="584" text-anchor="middle" fill="#e5e5e5" font-family="Arial, sans-serif" font-size="13" font-weight="700">O pedido que mudou o escopo</text>
  <text x="600" y="606" text-anchor="middle" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="12">Clientes passam a agendar sozinhas, sem depender de mensagem</text>
