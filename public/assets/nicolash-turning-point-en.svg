<svg viewBox="0 0 1300 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Panel A: Before -->
  <rect x="40" y="40" width="560" height="520" rx="18" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
  <rect x="68" y="70" width="112" height="36" rx="18" fill="#ffffff" stroke="#c8bd9e" stroke-width="2"/>
  <text x="124" y="94" text-anchor="middle" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">BEFORE</text>
  <text x="68" y="150" fill="#201d16" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Nicolash</text>
  <text x="68" y="178" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="19">Services and prices</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#201d16">
    <rect x="68" y="204" width="504" height="62" rx="10" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
    <text x="90" y="242">Egyptian Volume</text>
    <text x="548" y="242" text-anchor="end" fill="#716b54">$40</text>
    <rect x="68" y="274" width="504" height="62" rx="10" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
    <text x="90" y="312">Classic Lash Extensions</text>
    <text x="548" y="312" text-anchor="end" fill="#716b54">$30</text>
    <rect x="68" y="344" width="504" height="62" rx="10" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
    <text x="90" y="382">Eyebrow Design</text>
    <text x="548" y="382" text-anchor="end" fill="#716b54">$12</text>
  </g>

  <rect x="68" y="424" width="504" height="54" rx="27" fill="none" stroke="#9a937a" stroke-width="2"/>
  <text x="320" y="458" text-anchor="middle" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="19">Book via WhatsApp</text>
  <text x="68" y="514" fill="#8a8169" font-family="Arial, Helvetica, sans-serif" font-size="17">No real schedule, no conflict control</text>

  <!-- Panel B: After -->
  <rect x="700" y="40" width="560" height="520" rx="18" fill="#faf6ea" stroke="#2f7d46" stroke-width="2.5"/>
  <rect x="728" y="70" width="94" height="36" rx="18" fill="#ffffff" stroke="#2f7d46" stroke-width="2"/>
  <text x="775" y="94" text-anchor="middle" fill="#2f7d46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AFTER</text>
  <text x="728" y="150" fill="#201d16" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Nicolash</text>
  <text x="728" y="178" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="19">Online booking</text>

  <rect x="728" y="204" width="504" height="200" rx="14" fill="#ffffff" stroke="#ddd4b8" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#8a8169">
    <text x="754" y="234">S</text><text x="798" y="234">M</text><text x="842" y="234">T</text>
    <text x="886" y="234">W</text><text x="930" y="234">T</text><text x="974" y="234">F</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#201d16">
    <text x="754" y="268">3</text><text x="798" y="268">4</text><text x="842" y="268">5</text>
    <circle cx="896" cy="262" r="18" fill="#2f7d46"/>
    <text x="890" y="268" fill="#ffffff" font-weight="700">6</text>
    <text x="930" y="268">7</text><text x="974" y="268">8</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17">
    <rect x="754" y="294" width="92" height="40" rx="9" fill="#faf6ea" stroke="#ddd4b8" stroke-width="1.5"/>
    <text x="766" y="320" fill="#55503f">09:00</text>
    <rect x="858" y="294" width="92" height="40" rx="9" fill="#2f7d46"/>
    <text x="870" y="320" fill="#ffffff" font-weight="700">11:00</text>
    <rect x="962" y="294" width="92" height="40" rx="9" fill="#faf6ea" stroke="#ddd4b8" stroke-width="1.5"/>
    <text x="974" y="320" fill="#55503f">14:30</text>
  </g>
  <text x="754" y="378" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="17">Name and phone filled in by the client</text>

  <rect x="728" y="424" width="504" height="54" rx="27" fill="#2f7d46"/>
  <text x="980" y="458" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Confirm booking</text>
  <text x="728" y="514" fill="#2f7d46" font-family="Arial, Helvetica, sans-serif" font-size="17">Instant confirmation, no message needed</text>

  <!-- arrow between panels -->
  <path d="M608,300 L688,300" stroke="#9a937a" stroke-width="2.5" fill="none"/>
  <path d="M672,286 L690,300 L672,314" fill="none" stroke="#9a937a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom banner -->
  <rect x="190" y="596" width="920" height="110" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
  <text x="650" y="642" text-anchor="middle" fill="#201d16" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">The request that changed the scope</text>
  <text x="650" y="674" text-anchor="middle" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="19">Clients start booking for themselves, with no message needed</text>
</svg>
