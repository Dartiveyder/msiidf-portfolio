<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgStepsEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="url(#bgStepsEn)"/>

  <g font-family="Arial, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="40" width="260" height="380" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="170" cy="100" r="28" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="170" y="110" text-anchor="middle" fill="#3ddc6a" font-size="24" font-weight="700">1</text>
    <text x="170" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Rebuilding</text>
    <text x="170" y="192" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">the handoff</text>
    <text x="170" y="222" text-anchor="middle" fill="#9a9a9a" font-size="12.5">Handoff rebuilt as a</text>
    <text x="170" y="242" text-anchor="middle" fill="#9a9a9a" font-size="12.5">real Next.js project.</text>

    <!-- card 2 -->
    <rect x="327" y="40" width="260" height="380" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="457" cy="100" r="28" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="457" y="110" text-anchor="middle" fill="#3ddc6a" font-size="24" font-weight="700">2</text>
    <text x="457" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Choosing</text>
    <text x="457" y="192" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">the stack</text>
    <text x="457" y="222" text-anchor="middle" fill="#9a9a9a" font-size="12.5">Best language and</text>
    <text x="457" y="242" text-anchor="middle" fill="#9a9a9a" font-size="12.5">framework, free: Next.js</text>
    <text x="457" y="262" text-anchor="middle" fill="#9a9a9a" font-size="12.5">on Vercel.</text>

    <!-- card 3 -->
    <rect x="614" y="40" width="260" height="380" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="744" cy="100" r="28" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="744" y="110" text-anchor="middle" fill="#3ddc6a" font-size="24" font-weight="700">3</text>
    <text x="744" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Visual</text>
    <text x="744" y="192" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">iteration</text>
    <text x="744" y="222" text-anchor="middle" fill="#9a9a9a" font-size="12.5">Screenshots become</text>
    <text x="744" y="242" text-anchor="middle" fill="#9a9a9a" font-size="12.5">reusable component</text>
    <text x="744" y="262" text-anchor="middle" fill="#9a9a9a" font-size="12.5">patterns.</text>

    <!-- card 4 -->
    <rect x="900" y="40" width="260" height="380" rx="18" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="1030" cy="100" r="28" fill="#1a1a1a" stroke="#3ddc6a" stroke-width="2"/>
    <text x="1030" y="110" text-anchor="middle" fill="#3ddc6a" font-size="24" font-weight="700">4</text>
    <text x="1030" y="172" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">Mobile-first</text>
    <text x="1030" y="222" text-anchor="middle" fill="#9a9a9a" font-size="12.5">Acceptance criterion</text>
    <text x="1030" y="242" text-anchor="middle" fill="#9a9a9a" font-size="12.5">from the first delivery,</text>
    <text x="1030" y="262" text-anchor="middle" fill="#9a9a9a" font-size="12.5">built for phones.</text>
  </g>
</svg>
