  <rect x="728" y="424" width="504" height="54" rx="27" fill="#2f7d46"/>
  <text x="980" y="458" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Confirmar agendamento</text>
  <text x="728" y="514" fill="#2f7d46" font-family="Arial, Helvetica, sans-serif" font-size="17">Confirmação instantânea, sem trocar mensagem</text>

  <!-- arrow between panels -->
