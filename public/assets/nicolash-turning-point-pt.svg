  <path d="M672,286 L690,300 L672,314" fill="none" stroke="#9a937a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom banner -->
  <rect x="190" y="596" width="920" height="110" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
  <text x="650" y="642" text-anchor="middle" fill="#201d16" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">O pedido que mudou o escopo</text>
  <text x="650" y="674" text-anchor="middle" fill="#716b54" font-family="Arial, Helvetica, sans-serif" font-size="19">Clientes passam a agendar sozinhas, sem depender de mensagem</text>
