<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgImpactPt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="820" fill="url(#bgImpactPt)"/>

  <!-- Box 1: Problema -->
  <rect x="50" y="40" width="900" height="200" rx="18" fill="#151515" stroke="#e04b4b" stroke-opacity="0.55" stroke-width="2"/>
  <text x="80" y="76" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17" font-weight="700">Problema identificado</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#cfcfcf">
    <circle cx="90" cy="112" r="5" fill="#e04b4b"/>
    <text x="108" y="117">Agendamento só por WhatsApp, demora para confirmar horário</text>
    <circle cx="90" cy="144" r="5" fill="#e04b4b"/>
    <text x="108" y="149">Risco de duas pessoas marcarem o mesmo horário</text>
    <circle cx="90" cy="176" r="5" fill="#e04b4b"/>
    <text x="108" y="181">Custo de hospedagem alto para o tamanho do negócio</text>
  </g>

  <line x1="500" y1="240" x2="500" y2="272" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M490 264 L500 280 L510 264" fill="none" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Box 2: Decisões -->
  <rect x="50" y="280" width="900" height="200" rx="18" fill="#151515" stroke="#3ddc6a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="80" y="316" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17" font-weight="700">Decisões tomadas com Claude Code</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#cfcfcf">
    <circle cx="90" cy="352" r="5" fill="#3ddc6a"/>
    <text x="108" y="357">Sistema de agendamento com trava de concorrência no banco</text>
    <circle cx="90" cy="384" r="5" fill="#3ddc6a"/>
    <text x="108" y="389">Criptografia AES-256-GCM para nome e telefone das clientes</text>
    <circle cx="90" cy="416" r="5" fill="#3ddc6a"/>
    <text x="108" y="421">Migração de Next.js/Vercel para PHP e MySQL na HostGator</text>
  </g>

  <line x1="500" y1="480" x2="500" y2="512" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M490 504 L500 520 L510 504" fill="none" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Box 3: Impacto -->
  <rect x="50" y="520" width="900" height="260" rx="18" fill="#101010" stroke="#2a2a2a" stroke-width="2"/>
  <text x="80" y="558" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17" font-weight="700">Impacto</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="590" width="260" height="150" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="210" y="645" text-anchor="middle" fill="#3ddc6a" font-size="40" font-weight="700">100%</text>
    <text x="210" y="675" text-anchor="middle" fill="#cfcfcf" font-size="13">Paridade de funcionalidades</text>
    <text x="210" y="694" text-anchor="middle" fill="#cfcfcf" font-size="13">na migração</text>

    <rect x="370" y="590" width="260" height="150" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="500" y="645" text-anchor="middle" fill="#3ddc6a" font-size="40" font-weight="700">0</text>
    <text x="500" y="675" text-anchor="middle" fill="#cfcfcf" font-size="13">Conflitos de</text>
    <text x="500" y="694" text-anchor="middle" fill="#cfcfcf" font-size="13">horário</text>

    <rect x="660" y="590" width="260" height="150" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="790" y="645" text-anchor="middle" fill="#3ddc6a" font-size="40" font-weight="700">2</text>
    <text x="790" y="675" text-anchor="middle" fill="#cfcfcf" font-size="13">Arquiteturas completas</text>
    <text x="790" y="694" text-anchor="middle" fill="#cfcfcf" font-size="13">construídas</text>
  </g>
</svg>
