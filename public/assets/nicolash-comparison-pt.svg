<svg viewBox="0 0 1200 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCmpPt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bgCmpPt)"/>

  <!-- Card A: Vercel -->
  <rect x="60" y="40" width="520" height="610" rx="20" fill="#151515" stroke="#2a2a2a" stroke-width="2"/>
  <text x="320" y="80" text-anchor="middle" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="20" font-weight="700">Vercel · Next.js</text>
  <text x="320" y="104" text-anchor="middle" fill="#9a9a9a" font-family="Arial, sans-serif" font-size="13">Caminho inicial</text>
  <line x1="84" y1="120" x2="556" y2="120" stroke="#2a2a2a"/>

  <!-- Card B: HostGator -->
  <rect x="620" y="40" width="520" height="610" rx="20" fill="#151515" stroke="#3ddc6a" stroke-width="2"/>
  <text x="880" y="80" text-anchor="middle" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="20" font-weight="700">HostGator · PHP</text>
  <text x="880" y="104" text-anchor="middle" fill="#3ddc6a" font-family="Arial, sans-serif" font-size="13" font-weight="700">Caminho escolhido</text>
  <circle cx="1100" cy="72" r="16" fill="#3ddc6a"/>
  <path d="M1092 72 l6 6 l12 -14" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="644" y1="120" x2="1116" y2="120" stroke="#3ddc6a" stroke-opacity="0.4"/>

  <g font-family="Arial, sans-serif">
    <!-- row 0: Linguagem -->
    <text x="92" y="158" fill="#777777" font-size="10" letter-spacing="1.5">LINGUAGEM</text>
    <text x="92" y="182" fill="#e5e5e5" font-size="13">TypeScript/JavaScript de ponta a ponta</text>
    <line x1="84" y1="220" x2="556" y2="220" stroke="#2a2a2a"/>
    <text x="652" y="158" fill="#777777" font-size="10" letter-spacing="1.5">LINGUAGEM</text>
    <text x="652" y="182" fill="#e5e5e5" font-size="13">PHP no servidor, mesmo contrato de API</text>
    <line x1="644" y1="220" x2="1116" y2="220" stroke="#2a2a2a"/>

    <!-- row 1: Deploy -->
    <text x="92" y="246" fill="#777777" font-size="10" letter-spacing="1.5">DEPLOY</text>
    <text x="92" y="270" fill="#e5e5e5" font-size="13">Push no GitHub = deploy automático</text>
    <line x1="84" y1="308" x2="556" y2="308" stroke="#2a2a2a"/>
    <text x="652" y="246" fill="#777777" font-size="10" letter-spacing="1.5">DEPLOY</text>
    <text x="652" y="270" fill="#e5e5e5" font-size="13">Git Version Control do cPanel + chave SSH</text>
    <line x1="644" y1="308" x2="1116" y2="308" stroke="#2a2a2a"/>

    <!-- row 2: Banco de dados -->
    <text x="92" y="334" fill="#777777" font-size="10" letter-spacing="1.5">BANCO DE DADOS</text>
    <text x="92" y="358" fill="#e5e5e5" font-size="13">Postgres gerenciado (Neon)</text>
    <line x1="84" y1="396" x2="556" y2="396" stroke="#2a2a2a"/>
    <text x="652" y="334" fill="#777777" font-size="10" letter-spacing="1.5">BANCO DE DADOS</text>
    <text x="652" y="358" fill="#e5e5e5" font-size="13">MySQL via phpMyAdmin</text>
    <line x1="644" y1="396" x2="1116" y2="396" stroke="#2a2a2a"/>

    <!-- row 3: Segurança -->
    <text x="92" y="422" fill="#777777" font-size="10" letter-spacing="1.5">SEGURANÇA DE INFRAESTRUTURA</text>
    <text x="92" y="446" fill="#e5e5e5" font-size="13">HTTPS e isolamento geridos pela plataforma</text>
    <line x1="84" y1="484" x2="556" y2="484" stroke="#2a2a2a"/>
    <text x="652" y="422" fill="#777777" font-size="10" letter-spacing="1.5">SEGURANÇA DE INFRAESTRUTURA</text>
    <text x="652" y="446" fill="#e5e5e5" font-size="13">AutoSSL do cPanel + criptografia refeita em PHP</text>
    <line x1="644" y1="484" x2="1116" y2="484" stroke="#2a2a2a"/>

    <!-- row 4: Custo -->
    <text x="92" y="510" fill="#777777" font-size="10" letter-spacing="1.5">CUSTO MENSAL</text>
    <circle cx="518" cy="505" r="6" fill="#e04b4b"/>
    <text x="92" y="534" fill="#e5a24b" font-size="13" font-weight="700">Plano pago em dólar, sobe rápido</text>
    <line x1="84" y1="572" x2="556" y2="572" stroke="#2a2a2a"/>
    <text x="652" y="510" fill="#777777" font-size="10" letter-spacing="1.5">CUSTO MENSAL</text>
    <circle cx="1078" cy="505" r="6" fill="#3ddc6a"/>
    <text x="652" y="534" fill="#3ddc6a" font-size="13" font-weight="700">Fração do custo, cobrado em reais</text>
    <line x1="644" y1="572" x2="1116" y2="572" stroke="#2a2a2a"/>

    <!-- row 5: Melhor para -->
    <text x="92" y="598" fill="#777777" font-size="10" letter-spacing="1.5">MELHOR PARA</text>
    <text x="92" y="622" fill="#e5e5e5" font-size="13">Validar rápido, orçamento para hospedagem gerenciada</text>
    <text x="652" y="598" fill="#777777" font-size="10" letter-spacing="1.5">MELHOR PARA</text>
    <text x="652" y="622" fill="#e5e5e5" font-size="13">Negócio pequeno, local, orçamento apertado</text>
  </g>

  <!-- bottom banner -->
  <g font-family="Arial, sans-serif">
    <rect x="220" y="690" width="760" height="100" rx="16" fill="#101010" stroke="#2a2a2a" stroke-dasharray="4 4"/>
    <text x="260" y="730" fill="#e5e5e5" font-size="14" font-weight="700">Vercel · Next.js</text>
    <text x="600" y="733" text-anchor="middle" fill="#3ddc6a" font-size="18">→</text>
    <text x="940" y="730" text-anchor="end" fill="#e5e5e5" font-size="14" font-weight="700">HostGator · PHP</text>
    <text x="600" y="762" text-anchor="middle" fill="#9a9a9a" font-size="12">Migração completa de stack, motivada pelo custo mensal da hospedagem</text>
  </g>
</svg>
