<svg viewBox="0 0 1400 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="480" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="40" width="300" height="400" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="190" cy="104" r="32" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="190" y="115" text-anchor="middle" fill="#2f7d46" font-size="28" font-weight="700">1</text>
    <text x="190" y="184" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Reconstrução</text>
    <text x="190" y="214" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">do handoff</text>
    <text x="190" y="254" text-anchor="middle" fill="#55503f" font-size="22">Handoff reconstruído</text>
    <text x="190" y="280" text-anchor="middle" fill="#55503f" font-size="22">como projeto Next.js real.</text>

    <!-- card 2 -->
    <rect x="327" y="40" width="300" height="400" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="477" cy="104" r="32" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="477" y="115" text-anchor="middle" fill="#2f7d46" font-size="28" font-weight="700">2</text>
    <text x="477" y="184" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Pilha</text>
    <text x="477" y="214" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">tecnológica</text>
    <text x="477" y="254" text-anchor="middle" fill="#55503f" font-size="22">Melhor linguagem,</text>
    <text x="477" y="280" text-anchor="middle" fill="#55503f" font-size="22">grátis: Next.js na Vercel.</text>

    <!-- card 3 -->
    <rect x="614" y="40" width="300" height="400" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="764" cy="104" r="32" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="764" y="115" text-anchor="middle" fill="#2f7d46" font-size="28" font-weight="700">3</text>
    <text x="764" y="184" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Iteração</text>
    <text x="764" y="214" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">visual</text>
    <text x="764" y="254" text-anchor="middle" fill="#55503f" font-size="22">Prints de tela viram</text>
    <text x="764" y="280" text-anchor="middle" fill="#55503f" font-size="22">padrão reaproveitável.</text>

    <!-- card 4 -->
    <rect x="900" y="40" width="300" height="400" rx="16" fill="#faf6ea" stroke="#ddd4b8" stroke-width="2"/>
    <circle cx="1050" cy="104" r="32" fill="#ffffff" stroke="#2f7d46" stroke-width="2.5"/>
    <text x="1050" y="115" text-anchor="middle" fill="#2f7d46" font-size="28" font-weight="700">4</text>
    <text x="1050" y="199" text-anchor="middle" fill="#201d16" font-size="28" font-weight="700">Mobile-first</text>
    <text x="1050" y="254" text-anchor="middle" fill="#55503f" font-size="22">Critério de aceite</text>
    <text x="1050" y="280" text-anchor="middle" fill="#55503f" font-size="22">desde a 1ª entrega.</text>
  </g>
</svg>
