<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="600" fill="url(#bg2)"/>

  <!-- connecting line -->
  <line x1="180" y1="220" x2="1180" y2="220" stroke="#2a2a2a" stroke-width="2"/>

  <!-- 5 nodes -->
  <g font-family="Arial, sans-serif">
    <!-- 1 -->
    <g transform="translate(180,220)">
      <circle r="11" fill="#3ddc6a"/>
      <text y="-32" text-anchor="middle" fill="#f5f5f5" font-size="19" font-weight="700">Site institucional</text>
      <text y="-10" text-anchor="middle" fill="#9a9a9a" font-size="14">Design → Next.js → Vercel</text>
      <text y="42" text-anchor="middle" fill="#cfcfcf" font-size="14">Serviços, fotos, preços,</text>
      <text y="64" text-anchor="middle" fill="#cfcfcf" font-size="14">responsivo mobile</text>
    </g>

    <!-- 2 -->
    <g transform="translate(430,220)">
      <circle r="11" fill="#3ddc6a"/>
      <text y="-32" text-anchor="middle" fill="#f5f5f5" font-size="19" font-weight="700">Agendamento online</text>
      <text y="-10" text-anchor="middle" fill="#9a9a9a" font-size="14">Calendário + confirmação</text>
      <text y="42" text-anchor="middle" fill="#cfcfcf" font-size="14">Sem horários sobrepostos,</text>
      <text y="64" text-anchor="middle" fill="#cfcfcf" font-size="14">cancelamento via WhatsApp</text>
    </g>

    <!-- 3 -->
    <g transform="translate(680,220)">
      <circle r="11" fill="#3ddc6a"/>
      <text y="-32" text-anchor="middle" fill="#f5f5f5" font-size="19" font-weight="700">Painel administrativo</text>
      <text y="-10" text-anchor="middle" fill="#9a9a9a" font-size="14">Mobile-first · /admin</text>
      <text y="42" text-anchor="middle" fill="#cfcfcf" font-size="14">Agenda, bloqueios,</text>
      <text y="64" text-anchor="middle" fill="#cfcfcf" font-size="14">status dos horários</text>
    </g>

    <!-- 4 -->
    <g transform="translate(930,220)">
      <circle r="11" fill="#3ddc6a"/>
      <text y="-32" text-anchor="middle" fill="#f5f5f5" font-size="19" font-weight="700">Segurança dos dados</text>
      <text y="-10" text-anchor="middle" fill="#9a9a9a" font-size="14">Criptografia + sessão</text>
      <text y="42" text-anchor="middle" fill="#cfcfcf" font-size="14">AES-256-GCM, cookies</text>
      <text y="64" text-anchor="middle" fill="#cfcfcf" font-size="14">assinados, senha com hash</text>
    </g>

    <!-- 5 -->
    <g transform="translate(1180,220)">
      <circle r="13" fill="#3ddc6a"/>
      <text y="-32" text-anchor="middle" fill="#f5f5f5" font-size="19" font-weight="700">Migração de hospedagem</text>
      <text y="-10" text-anchor="middle" fill="#9a9a9a" font-size="14">Vercel → PHP/MySQL</text>
      <text y="42" text-anchor="middle" fill="#cfcfcf" font-size="14">cPanel + Git Version</text>
      <text y="64" text-anchor="middle" fill="#cfcfcf" font-size="14">Control, custo menor</text>
    </g>
  </g>

  <!-- bottom labels: cost trigger -->
  <g transform="translate(700,500)" font-family="Arial, sans-serif">
    <rect x="-320" y="-34" width="640" height="76" rx="18" fill="#151515" stroke="#2a2a2a"/>
    <text text-anchor="middle" y="-4" fill="#e5e5e5" font-size="16" font-weight="700">O gatilho da migração: custo</text>
    <text text-anchor="middle" y="22" fill="#9a9a9a" font-size="14">Hospedagem mensal na Vercel ficou alta para um negócio pequeno</text>
  </g>
</svg>
