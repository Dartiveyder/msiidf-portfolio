      <text y="48" text-anchor="middle" fill="#f4efe0" font-size="17">Só o que vai</text>
      <text y="72" text-anchor="middle" fill="#f4efe0" font-size="17">para produção</text>
    </g>

    <g transform="translate(570,198)">
      <circle r="16" fill="#6fcf8e" stroke="#f4efe0" stroke-width="2.5"/>
      <text y="-40" text-anchor="middle" fill="#f4efe0" font-size="24" font-weight="700">Chave SSH</text>
      <text y="-16" text-anchor="middle" fill="#bcd4c2" font-size="17">somente leitura</text>
      <text y="48" text-anchor="middle" fill="#f4efe0" font-size="17">Sem usar a senha</text>
      <text y="72" text-anchor="middle" fill="#f4efe0" font-size="17">pessoal da conta</text>
    </g>

    <g transform="translate(970,198)">
