    <rect x="68" y="362" width="504" height="62" rx="10" fill="#efe6d1" stroke="#30291f" stroke-width="2"/>
    <text x="90" y="400">Eyebrow Design</text>
    <text x="548" y="400" text-anchor="end" fill="#6f6650">$12</text>
  </g>

  <rect x="68" y="452" width="504" height="56" rx="28" fill="none" stroke="#6f6650" stroke-width="2.5"/>
